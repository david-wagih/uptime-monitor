x-app: &app
  build: .
  image: localhost/uptime-monitor-app:hardened
  entrypoint: ["/app/.venv/bin/python"]
  environment:
    PYTHONPATH: /app
    UPTIME_DATABASE_URL: postgresql+psycopg://uptime:uptime@db:5432/uptime
    UPTIME_CHECK_INTERVAL_SECONDS: "15"

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: uptime
      POSTGRES_PASSWORD: uptime
      POSTGRES_DB: uptime
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptime -d uptime"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    <<: *app
    command: ["-m", "uptime.migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    command: ["-m", "uvicorn", "uptime.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["-m", "uptime.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata: