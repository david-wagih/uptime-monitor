{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "uptime.dbHost" . }}
  labels:
    {{- include "uptime.labels" . | nindent 4 }}
    {{- include "uptime.selectorLabels" (dict "ctx" . "component" "db") | nindent 4 }}
spec:
  serviceName: {{ include "uptime.dbHost" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "uptime.selectorLabels" (dict "ctx" . "component" "db") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "uptime.selectorLabels" (dict "ctx" . "component" "db") | nindent 8 }}
    spec:
      containers:
        - name: db
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "uptime.fullname" . }}-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          {{- with .Values.postgresql.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
{{- end }}
