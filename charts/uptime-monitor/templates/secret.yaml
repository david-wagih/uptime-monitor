{{- if or (not .Values.externalDatabase.existingSecret) .Values.adminToken .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "uptime.fullname" . }}-secrets
  labels:
    {{- include "uptime.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.externalDatabase.existingSecret }}
  UPTIME_DATABASE_URL: {{ include "uptime.databaseUrl" . | quote }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | quote }}
  {{- end }}
  {{- if .Values.adminToken }}
  UPTIME_ADMIN_TOKEN: {{ .Values.adminToken | quote }}
  {{- end }}
{{- end }}
