apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uptime.fullname" . }}-worker
  labels:
    {{- include "uptime.labels" . | nindent 4 }}
    {{- include "uptime.selectorLabels" (dict "ctx" . "component" "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "uptime.selectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "uptime.selectorLabels" (dict "ctx" . "component" "worker") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "uptime.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "uptime.worker"]
          env:
            {{- include "uptime.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
