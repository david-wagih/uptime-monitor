{{- if .Values.migrate.enabled }}
# Runs after install (so the DB + secret exist) and after every upgrade.
# Retries via backoffLimit while Postgres is still starting.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "uptime.fullname" . }}-migrate
  labels:
    {{- include "uptime.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "uptime.selectorLabels" (dict "ctx" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "uptime.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "uptime.migrate"]
          env:
            {{- include "uptime.env" . | nindent 12 }}
{{- end }}
