apiVersion: v1
kind: Service
metadata:
  name: {{ include "uptime.fullname" . }}-api
  labels:
    {{- include "uptime.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "uptime.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
