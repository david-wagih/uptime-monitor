name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
    lint-tests:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v7.0.1 # we need to introducte commit SHA instead
          - name: astral-sh/setup-uv
            uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
            with:
              enable-cache: true
          - name: Run Ruff check
            run: uv run ruff check .
          - name: Run Pytest
            run: uv run pytest