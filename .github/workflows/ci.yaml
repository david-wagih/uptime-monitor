name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
    lint-and-test:
        runs-on: ubuntu-latest # type of the runner machine
        steps:
          - name: Checkout
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # we need to introducte commit SHA instead
          - name: astral-sh/setup-uv
            uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
            with:
              enable-cache: true
          - name: Run Ruff check
            run: uv run ruff check .
          - name: Run Pytest
            run: uv run pytest
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
          contents: read
          packages: write  # Enables pushing to ghcr.io
        needs: lint-and-test
        steps:
          - name: Checkout
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            
          - name: Log in to GitHub Container Registry
            uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
            with:
              registry: ${{ env.REGISTRY }}
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

          - name: Extract metadata (tags/labels) for Docker
            id: meta
            uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
            with:
              images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
              tags: |
                type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
                type=sha,format=short

          - name: Build Image for scanning
            uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
            with:
              context: .
              push: false
              load: true
              tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan
              labels: ${{ steps.meta.outputs.labels }}
          - name: Trivy Image Scan
            uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
            with:
              image-ref:  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan
              severity: HIGH,CRITICAL
              ignore-unfixed: true
              trivyignores: .trivyignore
              exit-code: '1'
          - name: Build and push Docker image
            uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
            with:
              context: .
              push: ${{ github.event_name != 'pull_request' }}
              tags: ${{ steps.meta.outputs.tags }}
              labels: ${{ steps.meta.outputs.labels }}
    helm-chart:
        runs-on: ubuntu-latest
        permissions:
          contents: read
          packages: write  # Enables pushing the chart to ghcr.io
        needs: build-and-push  # chart's appVersion points at the image pushed above
        env:
          CHART_DIR: charts/uptime-monitor
        steps:
          - name: Checkout
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

          # Helm is preinstalled on ubuntu-latest runners, so no extra action needed
          - name: Lint chart
            run: |
              helm version
              helm lint "$CHART_DIR"
              helm template uptime "$CHART_DIR" > /dev/null

          - name: Package chart
            id: package
            run: |
              SHORT_SHA="${GITHUB_SHA::7}"
              BASE_VERSION=$(yq '.version' "$CHART_DIR/Chart.yaml")
              # Unique per-commit version; appVersion matches the image tag from metadata-action (type=sha)
              VERSION="${BASE_VERSION}-sha-${SHORT_SHA}"
              helm package "$CHART_DIR" --version "$VERSION" --app-version "sha-${SHORT_SHA}" -d dist
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          - name: Push chart to GHCR
            if: github.event_name != 'pull_request'
            run: |
              OWNER="${GITHUB_REPOSITORY_OWNER,,}"  # OCI refs must be lowercase
              echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin
              # Pushed under /charts so it doesn't collide with the image ghcr.io/<owner>/uptime-monitor
              helm push dist/uptime-monitor-${{ steps.package.outputs.version }}.tgz "oci://${REGISTRY}/${OWNER}/charts"
