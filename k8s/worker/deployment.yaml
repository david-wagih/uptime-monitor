apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: uptime-monitor
spec:
  selector:
    matchLabels:
      app: worker
  template: # this defined the pod template
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: ghcr.io/david-wagih/uptime-monitor:sha-8896dbf
        command: ["python", "-m", "uptime.worker"]
        env:
        - name: UPTIME_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: UPTIME_DATABASE_URL
        - name: UPTIME_CHECK_INTERVAL_SECONDS
          value: "15"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
