apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: uptime-monitor
spec:
  template:
    spec:
      containers:
      - name: migrate
        image: ghcr.io/david-wagih/uptime-monitor:sha-8896dbf
        command: ["python", "-m", "uptime.migrate"]
        env:
        - name: UPTIME_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: UPTIME_DATABASE_URL
      restartPolicy: OnFailure
