apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: uptime-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template: # this defined the pod template
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: ghcr.io/david-wagih/uptime-monitor:sha-8896dbf
        env:
        - name: UPTIME_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: UPTIME_DATABASE_URL
        - name: UPTIME_CHECK_INTERVAL_SECONDS
          value: "15"
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 25
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
